<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Receipt</title>
  <style>
    body { margin: 0; padding: 0; background: #fff; color: #000; }

    /* Receipt layout (was baked into RECEIPT_HTML; moved here to shrink NFC payload). */
    #receipt {
      font: 13px ui-monospace, Menlo, Consolas, monospace;
      max-width: 340px;
      margin: 0 auto;
      padding: 12px 12px 88px;
    }
    #receipt .hdr { text-align: center; margin-bottom: 6px; }
    #receipt .row { display: flex; justify-content: space-between; margin: 1px 0; }
    #receipt .cn  { text-align: center; margin: 4px 0; }
    #receipt .sum { text-align: center; font-weight: bold; font-size: 14px; letter-spacing: 1px; margin: 10px 0 4px; }
    #receipt .tot { font-weight: bold; font-size: 15px; margin-top: 4px; }
    #receipt .ftr { text-align: center; font-size: 11px; line-height: 1.5; margin-top: 12px; }
    #receipt hr   { border: 0; border-top: 1px dashed #000; margin: 6px 0; }

    .save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 12px;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #ddd;
      box-sizing: border-box;
    }
    .save-bar button {
      flex: 1; padding: 12px;
      font: inherit; font-size: 16px;
      border: 1px solid #000; background: #fff; color: #000;
      border-radius: 6px; cursor: pointer;
    }
    .save-bar button:active { background: #000; color: #fff; }
    .save-bar button:disabled { opacity: 0.5; cursor: default; }

    @media print {
      .save-bar { display: none; }
      #receipt { padding-bottom: 12px; }
    }
  </style>
</head>
<body>
<div id="receipt"></div>
<div class="save-bar">
  <button id="btn-save" type="button">Save image</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  (async function () {
    var receiptEl = document.getElementById('receipt');
    try {
      var hash = location.hash.slice(1);
      if (!hash) {
        receiptEl.textContent = 'No receipt data.';
        return;
      }
      var b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
      var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      var decompressed = await new Response(stream).arrayBuffer();
      var html = new TextDecoder('utf-8').decode(decompressed);

      // Payload may be a full HTML doc or just body fragments — handle both.
      var parsed = new DOMParser().parseFromString(html, 'text/html');
      parsed.querySelectorAll('style').forEach(function (s) {
        document.head.appendChild(s.cloneNode(true));
      });
      receiptEl.innerHTML = parsed.body.innerHTML || html;
    } catch (e) {
      receiptEl.textContent = 'Invalid receipt link: ' + (e && e.message ? e.message : e);
    }
  })();

  document.getElementById('btn-save').addEventListener('click', async function () {
    var btn = this;
    if (typeof html2canvas !== 'function') {
      alert('Image library not loaded yet, try again.');
      return;
    }
    btn.disabled = true;
    var originalLabel = btn.textContent;
    btn.textContent = 'Saving…';
    try {
      var canvas = await html2canvas(document.getElementById('receipt'), {
        backgroundColor: '#ffffff',
        scale: 2,
        ignoreElements: function (el) { return el.classList && el.classList.contains('save-bar'); }
      });
      canvas.toBlob(function (blob) {
        if (!blob) {
          alert('Could not create image.');
          return;
        }
        var file = new File([blob], 'receipt.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: 'Receipt' }).catch(function () {});
        } else {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'receipt.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        }
      }, 'image/png');
    } catch (e) {
      alert('Failed to save image: ' + (e && e.message ? e.message : e));
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });
</script>
</body>
</html>
